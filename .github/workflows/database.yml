name: Database permissions

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  database:
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    env:
      CERTICHAIN_TEST_DISPOSABLE: '1'
      CERTICHAIN_TEST_CAMERA: '0'
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - name: Install Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.14.0
      - name: Install Supabase CLI
        uses: supabase/setup-cli@1dedf2c611547ede7232d26866dd3c56ab903bbb # v1.7.3
        with:
          version: 2.117.0
      - name: Start local Supabase
        run: supabase start
      - name: Rebuild database
        run: supabase db reset --local
      - name: SQL permission tests
        run: supabase test db --local
      - name: Function formatting, lint, types and unit tests
        run: |
          npx --yes deno@2.2.12 fmt --check supabase/functions supabase/tests/public_verification_http.mjs supabase/tests/issuance_http.mjs supabase/tests/certificate_pdf_http.mjs supabase/scripts/local_supabase.mjs supabase/tests/pdf_fixture.mjs supabase/tests/institution_concurrency.mjs supabase/tests/private_storage.mjs supabase/admin/reconcile_issuance.mjs supabase/tests/local_issuance_fixture.mjs supabase/tests/issuance_hardening.mjs mobile/tool/secure_issuance_browser.mjs mobile/tool/public_verification_browser.mjs mobile/tool/verify_qr.mjs mobile/tool/browser_harness.mjs mobile/tool/browser_harness_test.mjs mobile/tool/browser_harness_smoke.mjs mobile/tool/prepare_decoder.mjs mobile/tool/qr_test_video.mjs supabase/tests/hash_comparison_http.mjs supabase/tests/edge_runtime.mjs supabase/tests/edge_runtime_test.mjs mobile/tool/release_verification_browser.mjs
          npx --yes deno@2.2.12 lint supabase/functions
          npx --yes deno@2.2.12 check --frozen --config supabase/functions/deno.json supabase/functions/issue-certificate/index.ts supabase/functions/certificate-pdf/index.ts supabase/functions/verify-certificate/index.ts supabase/functions/compare-certificate-hash/index.ts
          npx --yes deno@2.2.12 test --frozen --config supabase/functions/deno.json supabase/functions
          node --check supabase/tests/issuance_http.mjs
          node --check supabase/admin/reconcile_issuance.mjs
          node --check supabase/tests/local_issuance_fixture.mjs
          node --check supabase/tests/issuance_hardening.mjs
          node --check supabase/tests/public_verification_http.mjs
          node --check mobile/tool/secure_issuance_browser.mjs
          node --check mobile/tool/public_verification_browser.mjs
          node --check mobile/tool/verify_qr.mjs
          node --test mobile/tool/browser_harness_test.mjs
          node --test supabase/tests/edge_runtime_test.mjs
          node mobile/tool/browser_harness_smoke.mjs
      - name: Issuance HTTP and recovery with real local Auth
        run: node supabase/tests/issuance_http.mjs
      - name: Native emulator console diagnostics
        shell: pwsh
        run: ./mobile/tool/native_adb_test.ps1
      - name: Issuance barriers, PDF compatibility and bounded abuse
        run: node supabase/tests/issuance_hardening.mjs
      - name: Private Storage HTTP tests
        run: node supabase/tests/private_storage.mjs
      - name: Authorized PDF HTTP and actual capability expiry
        run: node supabase/tests/certificate_pdf_http.mjs
      - name: Public verification without Auth and shared atomic budget
        env:
          CERTICHAIN_TEST_DISPOSABLE: '1'
        run: node supabase/tests/public_verification_http.mjs
      - name: Candidate comparison and shared concurrent public budget
        env:
          CERTICHAIN_TEST_DISPOSABLE: '1'
        run: node supabase/tests/hash_comparison_http.mjs
      - name: Concurrent owner protection
        run: node supabase/tests/institution_concurrency.mjs
      - name: Historical certificate migration preservation
        shell: pwsh
        run: ./supabase/tests/verify_certificate_migration.ps1
      - name: Historical data preserved by private issuance migration
        shell: pwsh
        run: ./supabase/tests/verify_private_issuance_migration.ps1
      - name: Historical data and private documents preserved by public verification
        shell: pwsh
        run: ./supabase/tests/verify_public_verification_migration.ps1
      - name: Private data preserved by candidate comparison migration
        shell: pwsh
        run: ./supabase/tests/verify_hash_comparison_migration.ps1
      - name: Lint project schemas
        run: supabase db lint --local --schema public,certichain_private --level warning --fail-on warning
      - name: Install pinned Flutter for the full local UI journey
        run: |
          git clone --depth 1 --branch 3.47.4 https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter"
          test "$(git -C "$RUNNER_TEMP/flutter" rev-parse HEAD)" = 9584c6713b324636289d067944a46fd6b49df14b
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
      - name: Flutter Web UI, real Auth, Edge, Storage and PostgreSQL
        working-directory: mobile
        run: |
          flutter pub get --enforce-lockfile
          flutter build web --no-web-resources-cdn --target=tool/secure_issuance_browser.dart --output=build/secure-issuance-e2e
          node tool/secure_issuance_browser.mjs
      - name: Independent QR decoder dependencies (test tools only)
        working-directory: mobile/tool
        run: |
          npm ci --ignore-scripts
          node prepare_decoder.mjs
          node prepare_decoder.mjs --check
          git diff --exit-code -- ../web/decoder
      - name: Public Flutter Web, links, private PDF comparison, QR and main startup failure (camera opt-in)
        working-directory: mobile
        env:
          CERTICHAIN_TEST_DISPOSABLE: '1'
        run: |
          flutter build web --no-web-resources-cdn --target=tool/public_verification_browser.dart --output=build/public-verification-e2e
          flutter build web --debug --no-web-resources-cdn --base-href=/production/ --dart-define=SUPABASE_URL=http://127.0.0.1:54321 --dart-define=PUBLIC_VERIFICATION_BASE_URL=http://127.0.0.1:7357/production/ --output=build/public-verification-main
          node tool/public_verification_browser.mjs
      - name: Production main.dart release over HTTPS and public journey (camera opt-in)
        working-directory: mobile
        env:
          CERTICHAIN_TEST_DISPOSABLE: '1'
        run: node tool/release_verification_browser.mjs
      - name: Upload sanitized release evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: phase8d-release-evidence
          path: mobile/build/phase8d-evidence
          if-no-files-found: ignore
      - name: Diff whitespace
        run: git diff --check
      - name: Stop local Supabase
        if: always()
        run: supabase stop --no-backup
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      ANDROID_NDK_VERSION: '28.2.13676358'
    defaults:
      run:
        shell: bash
        working-directory: mobile
    steps:
      - name: Runner disk space at start
        working-directory: ${{ runner.temp }}
        run: df -h
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - name: Install JDK 17 for Gradle 9.3.1 and AGP 9.1.0
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4.8.0
        with:
          distribution: temurin
          java-version: '17'
      - name: Install pinned stable Flutter
        run: |
          git clone --depth 1 --branch 3.47.4 https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter"
          test "$(git -C "$RUNNER_TEMP/flutter" rev-parse HEAD)" = 9584c6713b324636289d067944a46fd6b49df14b
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
      - name: Select the configured JDK and resolve frozen dependencies
        run: |
          flutter config --jdk-dir="$JAVA_HOME"
          java -version
          flutter pub get --enforce-lockfile
      - name: Install the NDK required by pinned Flutter
        run: |
          df -h
          flutter_ndk_version=$(sed -n 's/^[[:space:]]*val ndkVersion: String = "\([^"]*\)".*/\1/p' "$RUNNER_TEMP/flutter/packages/flutter_tools/gradle/src/main/kotlin/FlutterExtension.kt")
          test "$flutter_ndk_version" = "$ANDROID_NDK_VERSION"
          sdk_root="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          test -n "$sdk_root" && test -d "$sdk_root"
          sdkmanager="$sdk_root/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$sdkmanager" ]; then
            sdkmanager=$(command -v sdkmanager)
          fi
          test -x "$sdkmanager"
          printf 'Android SDK: %s\nsdkmanager: %s\nNDK: %s\n' "$sdk_root" "$sdkmanager" "$flutter_ndk_version"
          flutter config --android-sdk="$sdk_root"
          "$sdkmanager" --sdk_root="$sdk_root" --install "ndk;$ANDROID_NDK_VERSION"
          grep -Fx "Pkg.Revision = $ANDROID_NDK_VERSION" "$sdk_root/ndk/$ANDROID_NDK_VERSION/source.properties"
      - name: Compile Android main.dart entrypoint (debug APK)
        run: |
          df -h
          flutter build apk --debug --target=lib/main.dart
  flutter:
    runs-on: ubuntu-24.04
    env:
      CERTICHAIN_TEST_CAMERA: '0'
    timeout-minutes: 20
    defaults:
      run:
        working-directory: mobile
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - name: Install pinned stable Flutter
        # SDK archive is avoided; verify the exact stable tag's commit.
        run: |
          git clone --depth 1 --branch 3.47.4 https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter"
          test "$(git -C "$RUNNER_TEMP/flutter" rev-parse HEAD)" = 9584c6713b324636289d067944a46fd6b49df14b
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
      - name: Install Node for the isolated Chrome harness
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.14.0
      - name: Resolve frozen dependencies
        run: flutter pub get --enforce-lockfile
      - name: Format and analyze
        run: |
          dart format --output=none --set-exit-if-changed lib test tool
          flutter analyze
      - name: Domain, adapters and widgets
        env:
          CERTICHAIN_QR_CAPTURE: build/phase8b-qr.png
        run: flutter test
      - name: Decode the rendered QR independently
        run: |
          cd tool
          npm ci --ignore-scripts
          node verify_qr.mjs ../build/phase8b-qr.png http://localhost:7357/#/verify/e42f105a-a36b-40de-8326-47da5749eae3
      - name: Chrome PDF picker and download
        env:
          CHROME_EXECUTABLE: /usr/bin/google-chrome
        run: flutter test --platform chrome test/pdf_download_browser_test.dart test/verification_repository_test.dart
      - name: Chrome adapters against a real local Web build
        run: |
          flutter build web --no-web-resources-cdn --target=tool/pdf_browser_smoke.dart --output=build/browser-smoke
          node tool/pdf_browser_smoke.mjs
      - name: Prepare pinned offline scanner decoder
        run: |
          node tool/prepare_decoder.mjs
          node tool/prepare_decoder.mjs --check
          git diff --exit-code -- web/decoder
      - name: Build Web
        run: flutter build web --no-web-resources-cdn
